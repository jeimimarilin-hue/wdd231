<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Components Guide - Projects</title>
    <meta name="description" content="Submit your Arduino project details and view your submissions easily in this interactive guide.">
    <meta name="author" content="Jeimi Díaz Mariani">
    <meta property="og:title" content="Electronic Components Guide - Projects">
    <meta property="og:description" content="Submit your Arduino project details and view your submissions easily in this interactive guide.">
    <meta property="og:image" content="https://www.example.com/images/resistor_icon.webp">
    <meta property="og:url" content="https://www.example.com/projects.html">
    <link rel="icon" href="images/resistor_icon.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/light_mode.css">
</head>
<body>
    <header>
        <div class="logo-title">Arduino Component Guide</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="components.html">Components</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="siteplan.html">Site Plan</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <h1>Arduino Projects Submission</h1>
        
        <div id="results-container" class="component-card submission-results">
            <h2>Submission Details</h2>
            <p><strong>Project Name:</strong> <span id="res-title"></span></p>
            <p><strong>Main Component:</strong> <span id="res-component"></span></p>
            <p><strong>Description:</strong> <span id="res-desc"></span></p>
        </div>

        <form method="get" class="component-card project-form">
            <h2>Register a New Project</h2>
            <label for="project-title">Project Title:</label>
            <input type="text" id="project-title" name="title" required class="form-input">
            
            <label for="main-component">Primary Component Used:</label>
            <input type="text" id="main-component" name="component" required class="form-input">
            
            <label for="project-desc">Description:</label>
            <textarea id="project-desc" name="description" rows="3" required class="form-input"></textarea>
            
            <button type="submit" class="submit-btn">Submit Project</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Electronic Components Guide | Designed by Jeimi Díaz Mariani</p>
    </footer>

    <script type="module">
        const params = new URLSearchParams(window.location.search);
        if (params.has('title')) {
            document.getElementById('res-title').textContent = params.get('title');
            document.getElementById('res-component').textContent = params.get('component');
            document.getElementById('res-desc').textContent = params.get('description');
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.style.display = 'flex';
            resultsContainer.style.flexDirection = 'column';
        }
    </script>
</body>
</html>
